; FGUY Mod Loader settings
; Edit with Notepad. Lines starting with ; are comments.

[Display]
; How the game window is shown:
;   default    = use the game's own Options setting
;   fullscreen = fills the screen at the resolution picked in Options > Screen
;   windowed   = normal window with a border
;   borderless = windowed fullscreen: fills the screen, instant alt-tab
Mode=borderless

; Borderless always runs at your screen's own resolution (fullscreen and windowed use the
; resolution picked in the game's Options > Screen).

; Frame rate: vsync (default), 30, 60, 120, 144, 240 or uncapped. Also in Options > Screen.
FrameRate=vsync

; How the game draws:
;   dxvk = on Vulkan (default; smoother on modern PCs - a PC without Vulkan 1.3 gets d3d9 by itself)
;   d3d9 = the game's own DirectX 9 (try this if you see graphics problems)
Renderer=dxvk

; 1 = keep the game running when you alt-tab away (it normally pauses).
RunInBackground=0

[Graphics]
; All of these are in Main Menu > OPTIONS (SETTINGS), and change at once.
; 1 = a sharp picture (fixes the game's blur: its effects smear the picture). 0 = the game as it was.
SharpPicture=1
; 0 = no anti-aliasing (sharpest), 1 = FXAA (smooths jagged edges).
AntiAliasing=0
; Texture filtering: 0 = the game's own (bilinear), 1 = trilinear, 2 / 4 / 8 / 16 = anisotropic.
TextureFiltering=16
; Sharpening, 0 (none) to 100.
Sharpening=0
; Brightness, 0 to 100 (50 = the game's own).
Brightness=50
; The characters' black outlines: 0 = auto (as solid and thick as on the console, at any resolution), or 100 to 300
; (percent; 100 = the PC game's own, which get thinner and fainter the higher the resolution).
LineThickness=0
; 1 = the characters' textures at twice their size, made on this PC as they're first drawn (smoother lines up close:
; the menus, the lobby, 4K). 0 = the game's own.
HDCharacters=1

[Interface]
; 1 = Main Menu > OPTIONS opens the mod's SETTINGS page. 0 = the game's own options (with GRAPHICS in them).
MenuStyle=1

[Input]
; 1 = the Windows key works (the game normally blocks it).
AllowWindowsKey=1

[Online]
; The lobby server for Main Menu > ONLINE (address:port). Empty = the mod's own (the mod finds its address on GitHub,
; so it keeps working if the server moves). Only for your own server.
Server=
; Your name in lobbies: letters, digits, _ and -, up to 16. Empty = your Windows user name.
Name=
; 1 = in a match, connect straight to players who have this on too (lower ping when you're far apart). They see your
; internet (IP) address then, and you theirs. 0 = everything goes through the lobby server (addresses stay private).
; Also in the match's pause menu > SETTINGS.
DirectConnection=0

[Update]
; The mod checks this GitHub repository's latest release for a newer version (owner/name). Empty = no checks.
Repo=alphain24/FGUY-Mod
