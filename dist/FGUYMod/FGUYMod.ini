; FGUY Mod Loader settings
; Edit with Notepad. Lines starting with ; are comments.

[Display]
; How the game window is shown:
;   default    = use the game's own Options setting
;   fullscreen = classic exclusive fullscreen
;   windowed   = normal window with a border
;   borderless = windowed fullscreen: fills the screen, instant alt-tab
Mode=borderless

; Render resolution. 0 = your monitor's native resolution (borderless) or the game's setting.
; Lower values (e.g. 1920 x 1080) run faster; the picture is stretched to fill the screen.
Width=0
Height=0

; Frame rate: vsync (default), 30, 60, 120, 144, 240 or uncapped. Also in Options > Screen.
FrameRate=vsync

; 1 = keep the game running when you alt-tab away (it normally pauses).
RunInBackground=0

[Input]
; 1 = the Windows key works in windowed / borderless modes (the game normally blocks it).
AllowWindowsKey=1

[Online]
; The lobby server for Main Menu > ONLINE (address:port).
Server=127.0.0.1:7650
; Your name in lobbies: letters, digits, _ and -, up to 16. Empty = your Windows user name.
Name=
