[Mod]
Name=FGUY Controller Look
Version=0.2
Author=FGUY Mod
Description=The right stick aims like a modern shooter: a round deadzone, a response curve, the view turns at once, and speeds up when the stick is held at the edge. The camera moves in front of walls smoothly instead of jumping.
Type=gameplay
Plugin=controllerlook.dll

[Settings]
; Percent of the stick's travel: ignored near the middle / counted as full push near the edge
InnerDeadzone=8
OuterDeadzone=3
; Response curve, x100: 100 = linear, 200 = slow near the middle for fine aim (like CoD's "Standard")
Curve=200
; Top turn speed in percent of the game's (the game's aim sensitivity setting still applies); up / down in percent of left / right
Speed=100
PitchSpeed=100
; Held at the edge (RampEdge percent of the travel) for RampDelay ms, the turn speeds up over RampTime ms to RampBoost percent
RampEdge=95
RampDelay=150
RampTime=350
RampBoost=180
RampPitchBoost=120
; 1 = the camera behind you moves in front of walls smoothly (it looks CameraLookAhead ms ahead for them, and takes about
; CameraEaseIn ms to move in, CameraEaseOut ms back out); it never goes nearer a wall than the game has it. 0 = the game's jump.
CameraEase=1
CameraEaseIn=80
CameraEaseOut=250
CameraLookAhead=250
; 1: the game's turn speeds against this mod's, and the camera's distance from walls, in the log
Log=0
